name: "ESPHome MCP"
version: "1.0.1"
slug: "esphome_mcp"
description: "Model Context Protocol (MCP) server that lets LLM clients (e.g. Claude) manage ESPHome devices via the ESPHome Device Builder dashboard."
url: "https://github.com/loryanstrant/ESPHome-MCP"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
host_network: false

ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "MCP server endpoint (Streamable HTTP transport, path /mcp)"

options:
  esphome_dashboard_url: "http://core_esphome:6052"
  esphome_dashboard_username: ""
  esphome_dashboard_password: ""
  log_level: "INFO"

schema:
  esphome_dashboard_url: "str"
  esphome_dashboard_username: "str"
  esphome_dashboard_password: "password"
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
